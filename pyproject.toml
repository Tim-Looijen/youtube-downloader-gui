[project]
name = "youtube-downloader-gui"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyinstaller>=6.18.0",
    "requests>=2.32.5",
    # The [default] extra pulls in yt-dlp-ejs, which ships the JS-challenge
    # solver scripts. PyInstaller's yt-dlp hook only bundles those scripts when
    # the package is installed; without it a frozen build fails with
    # "This video is not available" on videos that need signature/n solving.
    "yt-dlp[default]>=2026.8.19",
]
